; nwn5e settings. 1 = 2024 rule, 0 = the game's original 3e behaviour.
[loader]
; Leave empty to use the folder the NWN installer registered.
game_dir=

[rules]
; faithful = D&D 2024 as written; nwn = 2024 with NWN's own choices kept where
; they exist for gameplay. Sets the default for every rule below that has
; both versions (racial_combat_bonuses and later); each one can override it
; with faithful, nwn or off (off = the game's original 3e behaviour).
mode=faithful
; NWN's racial bonuses against specific enemies (Battle Training +1 to hit vs
; orcs/goblinoids/reptilians, halfling Good Aim and sling +1, +4 AC vs
; giants): faithful removes them (2024 species have none); nwn keeps them.
racial_combat_bonuses=
; 2024 saving throws. Fortitude / Reflex / Will are your Constitution /
; Dexterity / Wisdom saves: ability modifier + proficiency bonus in your first
; class's saves (Great Fortitude, Lightning Reflexes, Iron Will add one) +
; magic. Spell DCs are 8 + proficiency bonus + casting modifier; traps,
; poisons and other fixed DCs are converted to the 2024 scale. Species get
; their 2024 advantages (dwarf vs poison, halfling vs fear and Luck, elf vs
; charm, gnome on Will saves).
; faithful: monsters have no save proficiency, no automatic 1/20, paladins
; get Aura of Protection from level 6. nwn: monsters keep their good saves,
; NWN's flat feat/racial save bonuses stay, natural 20 saves, Spell Focus
; +1/+2/+3. off: NWN's 3e saves and DCs.
saves=
; Opportunity attacks. Both versions: one per round per creature, moving away
; provokes, Tumble avoids it. faithful: only moving away provokes — casting,
; drinking potions, ranged attacks, unarmed attacks and Disarm no longer do; Spring Attack no
; longer protects. nwn (or off): NWN's opportunity attacks.
opportunity_attacks=
; Two-weapon fighting. faithful: no attack penalty on either hand; one
; off-hand attack per round, only with two Light weapons (club, dagger,
; handaxe, light hammer, sickle, scimitar, shortsword, kukri, kama), a double
; weapon, or Improved Two-Weapon Fighting (= Dual Wielder: any weapons);
; the off-hand attack adds no Strength to damage unless it is negative, or
; with the Two-Weapon Fighting feat (= the fighting style); Ambidexterity
; does nothing. nwn (or off): NWN's penalties, feats, second off-hand
; attack and half Strength.
two_weapon_fighting=
; Weapon mastery: who has it with which weapons (the effects come later).
; faithful: the 2024 slots (Fighter 3/4/5/6 at levels 1/4/10/16, Barbarian
; 2/3/4 at 1/4/10, Paladin, Ranger, Rogue 2), chosen by typing !mastery
; <weapon> in chat or filled with the weapons you fight with; after each
; long rest one can be swapped (!mastery <old> for <new>); !mastery lists
; them. nwn: those classes master every weapon they are proficient with.
; Both: Weapon Focus also gives mastery with its weapon. off: no mastery.
weapon_mastery=
; Critical hits only on a natural 20.
crit_nat20_only=1
; A natural 20 is a critical hit; no confirmation roll.
crit_no_confirmation=1
; Every weapon crits for x2 (3e axes/scythes used x3/x4).
crit_double_damage=1
; 2024 critical damage: the damage dice are rolled twice, flat bonuses
; (Strength etc.) are added once. Needs crit_double_damage=1.
crit_dice_only=1
; Creatures can score critical hits on your party at every difficulty (NWN
; turns them into plain hits at some difficulties; 2024 has no such rule).
crits_against_players=1
; Attack rolls use the 2024 proficiency bonus (by level for your party, by
; challenge rating for creatures) instead of the 3e base attack bonus.
attack_proficiency=1
; Creatures that are not player characters use the 5e AC for their challenge rating.
creature_ac_by_cr=1
; Extra Attack: your party makes the 2024 number of attacks (2 at level 5 for
; Barbarian/Fighter/Monk/Paladin/Ranger, Fighter 3 at 11 and 4 at 20; others 1),
; creatures keep NWN's count, and no extra attack takes the 3e -5 penalty.
extra_attack=1
; When an attack kills its target and attacks are left this round, the rest
; go to the nearest enemy: in reach (melee), or (ranged) one already fighting
; you or your party within ranged_retarget_range.
retarget_remaining_attacks=1
; How far, in metres, ranged attacks look for that enemy (at most 40, a bow's
; range). Lower it if a far enemy ever gets picked by mistake.
ranged_retarget_range=40
; 2024 advantage/disadvantage instead of NWN's situational bonuses: roll two
; d20s and keep the higher (target blind or stunned, you unseen, target prone
; next to you) or the lower (target unseen, target prone at range, shooting
; with an enemy within 5 ft who sees you — unless you have Point Blank Shot).
; Flanking and "moving target" give nothing.
advantage_disadvantage=1
; Write each rule decision to nwn5e.log (next to nwn5e.dll).
log_attacks=1

[debug]
; TEST SWITCH: every hit is a critical hit, even against crit-immune creatures.
; Use it to confirm the mod is active (confirmed in game 2026-10-17).
every_hit_crits=0
; TEST SWITCH: if above 0, your party makes this many main-hand attacks per
; round (all at the full bonus) — to see Extra Attack before level 5.
attacks_per_round=0
; DIAGNOSTIC: log how each of your combat rounds is set up and every attack
; roll your party makes (first 300 lines).
attack_trace=0
; TEST SWITCH: if above 0, every creature that is not a player character has
; this AC — e.g. 40 makes your attacks miss (natural 20s still hit), so every
; attack of a round is rolled instead of the round ending with the first kill.
creature_ac=0
; TEST SWITCH: if above 1, a creature that is not a character gets this many
; times its current hit points the first time your party attacks it (once
; per creature, again after a reload) - so weak monsters survive several hits.
creature_hp_multiplier=0
; TEST SWITCH: if above 0, such a creature has at least this many hit points
; then (e.g. 30: a 1-hit-point goblin takes several hits).
creature_min_hp=0
; DIAGNOSTIC: the game's own breakdown of every attack (each bonus by name:
; "[2] Dex Modifier", "[1] Size Modifier"…) in the combat log. Noisy;
; turn it on for a fight when a number looks wrong.
combat_breakdown=0
